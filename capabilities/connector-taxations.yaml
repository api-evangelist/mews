naftiko: 1.0.0-alpha2
info:
  label: Connector API — Taxations
  description: 'Connector API — Taxations. 1 operations. Lead operation: Get all taxations. Self-contained Naftiko capability
    covering one Mews business surface.'
  tags:
  - Mews
  - Taxations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MEWS_API_KEY: MEWS_API_KEY
capability:
  consumes:
  - type: http
    namespace: connector-taxations
    baseUri: https://api.mews.com
    description: Connector API — Taxations business capability. Self-contained, no shared references.
    resources:
    - name: api-connector-v1-taxations-getAll
      path: /api/connector/v1/taxations/getAll
      operations:
      - name: taxationsgetall
        method: POST
        description: Get all taxations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: connector-taxations-rest
    port: 8080
    description: REST adapter for Connector API — Taxations. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/connector/v1/taxations/getall
      name: api-connector-v1-taxations-getall
      description: REST surface for api-connector-v1-taxations-getAll.
      operations:
      - method: POST
        name: taxationsgetall
        description: Get all taxations
        call: connector-taxations.taxationsgetall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connector-taxations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Connector API — Taxations. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-all-taxations
      description: Get all taxations
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: connector-taxations.taxationsgetall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
