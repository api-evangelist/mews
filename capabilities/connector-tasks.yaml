naftiko: 1.0.0-alpha2
info:
  label: Connector API — Tasks
  description: 'Connector API — Tasks. 3 operations. Lead operation: Add task. Self-contained Naftiko capability covering
    one Mews business surface.'
  tags:
  - Mews
  - Tasks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MEWS_API_KEY: MEWS_API_KEY
capability:
  consumes:
  - type: http
    namespace: connector-tasks
    baseUri: https://api.mews.com
    description: Connector API — Tasks business capability. Self-contained, no shared references.
    resources:
    - name: api-connector-v1-tasks-add
      path: /api/connector/v1/tasks/add
      operations:
      - name: tasksadd
        method: POST
        description: Add task
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: api-connector-v1-tasks-close
      path: /api/connector/v1/tasks/close
      operations:
      - name: tasksclose
        method: POST
        description: Close task
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: api-connector-v1-tasks-getAll
      path: /api/connector/v1/tasks/getAll
      operations:
      - name: tasksgetall
        method: POST
        description: Get all tasks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: connector-tasks-rest
    port: 8080
    description: REST adapter for Connector API — Tasks. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/connector/v1/tasks/add
      name: api-connector-v1-tasks-add
      description: REST surface for api-connector-v1-tasks-add.
      operations:
      - method: POST
        name: tasksadd
        description: Add task
        call: connector-tasks.tasksadd
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/connector/v1/tasks/close
      name: api-connector-v1-tasks-close
      description: REST surface for api-connector-v1-tasks-close.
      operations:
      - method: POST
        name: tasksclose
        description: Close task
        call: connector-tasks.tasksclose
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/connector/v1/tasks/getall
      name: api-connector-v1-tasks-getall
      description: REST surface for api-connector-v1-tasks-getAll.
      operations:
      - method: POST
        name: tasksgetall
        description: Get all tasks
        call: connector-tasks.tasksgetall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connector-tasks-mcp
    port: 9090
    transport: http
    description: MCP adapter for Connector API — Tasks. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: add-task
      description: Add task
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: connector-tasks.tasksadd
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: close-task
      description: Close task
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: connector-tasks.tasksclose
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-all-tasks
      description: Get all tasks
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: connector-tasks.tasksgetall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
