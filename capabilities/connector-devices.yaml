naftiko: 1.0.0-alpha2
info:
  label: Connector API — Devices
  description: 'Connector API — Devices. 1 operations. Lead operation: Get all devices. Self-contained Naftiko capability
    covering one Mews business surface.'
  tags:
  - Mews
  - Devices
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MEWS_API_KEY: MEWS_API_KEY
capability:
  consumes:
  - type: http
    namespace: connector-devices
    baseUri: https://api.mews.com
    description: Connector API — Devices business capability. Self-contained, no shared references.
    resources:
    - name: api-connector-v1-devices-getAll
      path: /api/connector/v1/devices/getAll
      operations:
      - name: devicesgetall
        method: POST
        description: Get all devices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: connector-devices-rest
    port: 8080
    description: REST adapter for Connector API — Devices. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/connector/v1/devices/getall
      name: api-connector-v1-devices-getall
      description: REST surface for api-connector-v1-devices-getAll.
      operations:
      - method: POST
        name: devicesgetall
        description: Get all devices
        call: connector-devices.devicesgetall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connector-devices-mcp
    port: 9090
    transport: http
    description: MCP adapter for Connector API — Devices. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-all-devices
      description: Get all devices
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: connector-devices.devicesgetall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
