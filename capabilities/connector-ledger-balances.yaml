naftiko: 1.0.0-alpha2
info:
  label: Connector API — Ledger balances
  description: 'Connector API — Ledger balances. 1 operations. Lead operation: Get all ledger balances. Self-contained Naftiko
    capability covering one Mews business surface.'
  tags:
  - Mews
  - Ledger balances
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MEWS_API_KEY: MEWS_API_KEY
capability:
  consumes:
  - type: http
    namespace: connector-ledger-balances
    baseUri: https://api.mews.com
    description: Connector API — Ledger balances business capability. Self-contained, no shared references.
    resources:
    - name: api-connector-v1-ledgerBalances-getAll
      path: /api/connector/v1/ledgerBalances/getAll
      operations:
      - name: ledgerbalancesgetall
        method: POST
        description: Get all ledger balances
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: connector-ledger-balances-rest
    port: 8080
    description: REST adapter for Connector API — Ledger balances. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/connector/v1/ledgerbalances/getall
      name: api-connector-v1-ledgerbalances-getall
      description: REST surface for api-connector-v1-ledgerBalances-getAll.
      operations:
      - method: POST
        name: ledgerbalancesgetall
        description: Get all ledger balances
        call: connector-ledger-balances.ledgerbalancesgetall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connector-ledger-balances-mcp
    port: 9090
    transport: http
    description: MCP adapter for Connector API — Ledger balances. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-all-ledger-balances
      description: Get all ledger balances
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: connector-ledger-balances.ledgerbalancesgetall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
