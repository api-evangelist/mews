naftiko: 1.0.0-alpha2
info:
  label: Connector API — Reservation groups
  description: 'Connector API — Reservation groups. 1 operations. Lead operation: Get all reservation groups. Self-contained
    Naftiko capability covering one Mews business surface.'
  tags:
  - Mews
  - Reservation groups
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MEWS_API_KEY: MEWS_API_KEY
capability:
  consumes:
  - type: http
    namespace: connector-reservation-groups
    baseUri: https://api.mews.com
    description: Connector API — Reservation groups business capability. Self-contained, no shared references.
    resources:
    - name: api-connector-v1-reservationGroups-getAll
      path: /api/connector/v1/reservationGroups/getAll
      operations:
      - name: reservationgroupsgetall
        method: POST
        description: Get all reservation groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: connector-reservation-groups-rest
    port: 8080
    description: REST adapter for Connector API — Reservation groups. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/connector/v1/reservationgroups/getall
      name: api-connector-v1-reservationgroups-getall
      description: REST surface for api-connector-v1-reservationGroups-getAll.
      operations:
      - method: POST
        name: reservationgroupsgetall
        description: Get all reservation groups
        call: connector-reservation-groups.reservationgroupsgetall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connector-reservation-groups-mcp
    port: 9090
    transport: http
    description: MCP adapter for Connector API — Reservation groups. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-all-reservation-groups
      description: Get all reservation groups
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: connector-reservation-groups.reservationgroupsgetall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
