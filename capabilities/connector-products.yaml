        description: Delete products
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: api-connector-v1-products-getAll
      path: /api/connector/v1/products/getAll
      operations:
      - name: productsgetall
