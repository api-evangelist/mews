  exposes:
  - type: rest
    namespace: connector-products-rest
    port: 8080
    description: REST adapter for Connector API — Products. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/connector/v1/products/delete
      name: api-connector-v1-products-delete
      description: REST surface for api-connector-v1-products-delete.
      operations:
      - method: POST
        name: productsdelete
        description: Delete products
        call: connector-products.productsdelete
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/connector/v1/products/getall
      name: api-connector-v1-products-getall
      description: REST surface for api-connector-v1-products-getAll.
      operations:
      - method: POST
        name: productsgetall
        description: Get all products
        call: connector-products.productsgetall
