naftiko: 1.0.0-alpha2
info:
  label: Connector API — Availability adjustments
  description: 'Connector API — Availability adjustments. 1 operations. Lead operation: Get all availability adjustments.
    Self-contained Naftiko capability covering one Mews business surface.'
  tags:
  - Mews
  - Availability adjustments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MEWS_API_KEY: MEWS_API_KEY
capability:
  consumes:
  - type: http
    namespace: connector-availability-adjustments
    baseUri: https://api.mews.com
    description: Connector API — Availability adjustments business capability. Self-contained, no shared references.
    resources:
    - name: api-connector-v1-availabilityAdjustments-getAll
      path: /api/connector/v1/availabilityAdjustments/getAll
      operations:
      - name: availabilityadjustmentsgetall
        method: POST
        description: Get all availability adjustments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: connector-availability-adjustments-rest
    port: 8080
    description: REST adapter for Connector API — Availability adjustments. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/connector/v1/availabilityadjustments/getall
      name: api-connector-v1-availabilityadjustments-getall
      description: REST surface for api-connector-v1-availabilityAdjustments-getAll.
      operations:
      - method: POST
        name: availabilityadjustmentsgetall
        description: Get all availability adjustments
        call: connector-availability-adjustments.availabilityadjustmentsgetall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connector-availability-adjustments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Connector API — Availability adjustments. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get-all-availability-adjustments
      description: Get all availability adjustments
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: connector-availability-adjustments.availabilityadjustmentsgetall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
