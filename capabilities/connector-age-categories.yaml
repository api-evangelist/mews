naftiko: 1.0.0-alpha2
info:
  label: Connector API — Age categories
  description: 'Connector API — Age categories. 1 operations. Lead operation: Get all age categories. Self-contained Naftiko
    capability covering one Mews business surface.'
  tags:
  - Mews
  - Age categories
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MEWS_API_KEY: MEWS_API_KEY
capability:
  consumes:
  - type: http
    namespace: connector-age-categories
    baseUri: https://api.mews.com
    description: Connector API — Age categories business capability. Self-contained, no shared references.
    resources:
    - name: api-connector-v1-ageCategories-getAll
      path: /api/connector/v1/ageCategories/getAll
      operations:
      - name: agecategoriesgetall
        method: POST
        description: Get all age categories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: connector-age-categories-rest
    port: 8080
    description: REST adapter for Connector API — Age categories. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/connector/v1/agecategories/getall
      name: api-connector-v1-agecategories-getall
      description: REST surface for api-connector-v1-ageCategories-getAll.
      operations:
      - method: POST
        name: agecategoriesgetall
        description: Get all age categories
        call: connector-age-categories.agecategoriesgetall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connector-age-categories-mcp
    port: 9090
    transport: http
    description: MCP adapter for Connector API — Age categories. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-all-age-categories
      description: Get all age categories
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: connector-age-categories.agecategoriesgetall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
