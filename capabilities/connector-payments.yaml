        idempotent: false
      call: connector-payments.paymentsaddexternal
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-all-payments
      description: Get all payments
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: connector-payments.paymentsgetall
      with:
