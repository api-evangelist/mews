naftiko: 1.0.0-alpha2
info:
  label: Connector API — Countries
  description: 'Connector API — Countries. 1 operations. Lead operation: Get all countries. Self-contained Naftiko capability
    covering one Mews business surface.'
  tags:
  - Mews
  - Countries
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MEWS_API_KEY: MEWS_API_KEY
capability:
  consumes:
  - type: http
    namespace: connector-countries
    baseUri: https://api.mews.com
    description: Connector API — Countries business capability. Self-contained, no shared references.
    resources:
    - name: api-connector-v1-countries-getAll
      path: /api/connector/v1/countries/getAll
      operations:
      - name: countriesgetall
        method: POST
        description: Get all countries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: connector-countries-rest
    port: 8080
    description: REST adapter for Connector API — Countries. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/connector/v1/countries/getall
      name: api-connector-v1-countries-getall
      description: REST surface for api-connector-v1-countries-getAll.
      operations:
      - method: POST
        name: countriesgetall
        description: Get all countries
        call: connector-countries.countriesgetall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connector-countries-mcp
    port: 9090
    transport: http
    description: MCP adapter for Connector API — Countries. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-all-countries
      description: Get all countries
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: connector-countries.countriesgetall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
