naftiko: 1.0.0-alpha2
info:
  label: Connector API — Departments
  description: 'Connector API — Departments. 1 operations. Lead operation: Get all departments. Self-contained Naftiko capability
    covering one Mews business surface.'
  tags:
  - Mews
  - Departments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MEWS_API_KEY: MEWS_API_KEY
capability:
  consumes:
  - type: http
    namespace: connector-departments
    baseUri: https://api.mews.com
    description: Connector API — Departments business capability. Self-contained, no shared references.
    resources:
    - name: api-connector-v1-departments-getAll
      path: /api/connector/v1/departments/getAll
      operations:
      - name: departmentsgetall
        method: POST
        description: Get all departments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: connector-departments-rest
    port: 8080
    description: REST adapter for Connector API — Departments. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/connector/v1/departments/getall
      name: api-connector-v1-departments-getall
      description: REST surface for api-connector-v1-departments-getAll.
      operations:
      - method: POST
        name: departmentsgetall
        description: Get all departments
        call: connector-departments.departmentsgetall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connector-departments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Connector API — Departments. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-all-departments
      description: Get all departments
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: connector-departments.departmentsgetall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
