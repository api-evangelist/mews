naftiko: 1.0.0-alpha2
info:
  label: Connector API — Outlet bills
  description: 'Connector API — Outlet bills. 1 operations. Lead operation: Add outlet bills. Self-contained Naftiko capability
    covering one Mews business surface.'
  tags:
  - Mews
  - Outlet bills
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MEWS_API_KEY: MEWS_API_KEY
capability:
  consumes:
  - type: http
    namespace: connector-outlet-bills
    baseUri: https://api.mews.com
    description: Connector API — Outlet bills business capability. Self-contained, no shared references.
    resources:
    - name: api-connector-v1-outletBills-add
      path: /api/connector/v1/outletBills/add
      operations:
      - name: outletbillsadd
        method: POST
        description: Add outlet bills
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: connector-outlet-bills-rest
    port: 8080
    description: REST adapter for Connector API — Outlet bills. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/connector/v1/outletbills/add
      name: api-connector-v1-outletbills-add
      description: REST surface for api-connector-v1-outletBills-add.
      operations:
      - method: POST
        name: outletbillsadd
        description: Add outlet bills
        call: connector-outlet-bills.outletbillsadd
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connector-outlet-bills-mcp
    port: 9090
    transport: http
    description: MCP adapter for Connector API — Outlet bills. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: add-outlet-bills
      description: Add outlet bills
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: connector-outlet-bills.outletbillsadd
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
