naftiko: 1.0.0-alpha2
info:
  label: Connector API — Outlet items
  description: 'Connector API — Outlet items. 1 operations. Lead operation: Get all outlet items. Self-contained Naftiko capability
    covering one Mews business surface.'
  tags:
  - Mews
  - Outlet items
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MEWS_API_KEY: MEWS_API_KEY
capability:
  consumes:
  - type: http
    namespace: connector-outlet-items
    baseUri: https://api.mews.com
    description: Connector API — Outlet items business capability. Self-contained, no shared references.
    resources:
    - name: api-connector-v1-outletItems-getAll
      path: /api/connector/v1/outletItems/getAll
      operations:
      - name: outletitemsgetall
        method: POST
        description: Get all outlet items
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: connector-outlet-items-rest
    port: 8080
    description: REST adapter for Connector API — Outlet items. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/connector/v1/outletitems/getall
      name: api-connector-v1-outletitems-getall
      description: REST surface for api-connector-v1-outletItems-getAll.
      operations:
      - method: POST
        name: outletitemsgetall
        description: Get all outlet items
        call: connector-outlet-items.outletitemsgetall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connector-outlet-items-mcp
    port: 9090
    transport: http
    description: MCP adapter for Connector API — Outlet items. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-all-outlet-items
      description: Get all outlet items
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: connector-outlet-items.outletitemsgetall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
