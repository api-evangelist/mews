naftiko: 1.0.0-alpha2
info:
  label: Connector API — Sources
  description: 'Connector API — Sources. 1 operations. Lead operation: Get all sources. Self-contained Naftiko capability
    covering one Mews business surface.'
  tags:
  - Mews
  - Sources
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MEWS_API_KEY: MEWS_API_KEY
capability:
  consumes:
  - type: http
    namespace: connector-sources
    baseUri: https://api.mews.com
    description: Connector API — Sources business capability. Self-contained, no shared references.
    resources:
    - name: api-connector-v1-sources-getAll
      path: /api/connector/v1/sources/getAll
      operations:
      - name: sourcesgetall
        method: POST
        description: Get all sources
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: connector-sources-rest
    port: 8080
    description: REST adapter for Connector API — Sources. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/connector/v1/sources/getall
      name: api-connector-v1-sources-getall
      description: REST surface for api-connector-v1-sources-getAll.
      operations:
      - method: POST
        name: sourcesgetall
        description: Get all sources
        call: connector-sources.sourcesgetall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connector-sources-mcp
    port: 9090
    transport: http
    description: MCP adapter for Connector API — Sources. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-all-sources
      description: Get all sources
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: connector-sources.sourcesgetall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
