naftiko: 1.0.0-alpha2
info:
  label: Connector API — Rules
  description: 'Connector API — Rules. 1 operations. Lead operation: Get all rules. Self-contained Naftiko capability covering
    one Mews business surface.'
  tags:
  - Mews
  - Rules
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MEWS_API_KEY: MEWS_API_KEY
capability:
  consumes:
  - type: http
    namespace: connector-rules
    baseUri: https://api.mews.com
    description: Connector API — Rules business capability. Self-contained, no shared references.
    resources:
    - name: api-connector-v1-rules-getAll
      path: /api/connector/v1/rules/getAll
      operations:
      - name: rulesgetall
        method: POST
        description: Get all rules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: connector-rules-rest
    port: 8080
    description: REST adapter for Connector API — Rules. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/connector/v1/rules/getall
      name: api-connector-v1-rules-getall
      description: REST surface for api-connector-v1-rules-getAll.
      operations:
      - method: POST
        name: rulesgetall
        description: Get all rules
        call: connector-rules.rulesgetall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connector-rules-mcp
    port: 9090
    transport: http
    description: MCP adapter for Connector API — Rules. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-all-rules
      description: Get all rules
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: connector-rules.rulesgetall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
